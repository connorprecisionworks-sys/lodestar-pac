[project]
name = "lodestar"
version = "0.1.0"
description = "Lodestar PAC - Predictive Asteroid Characterization. An ML-augmented prospecting and feasibility-screening engine for near-Earth asteroids."
readme = "README.md"
requires-python = ">=3.10,<3.12"

# Phase 0 core: data ingestion + normalization to a local parquet store.
# Astrodynamics (Phase 2+), ML (Phase 4), and the API (Phase 1) live in the
# optional groups below so the base install stays lean.
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=9.0",
]

[project.optional-dependencies]
# Phase 1 - thin FastAPI layer over the precomputed parquet store.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# Phase 2+ - astrodynamics. hapsira is the maintained poliastro fork (NOT poliastro).
astro = [
    "hapsira>=0.18",
    "astropy>=6.1",
    "astroquery>=0.4.7",
]
# Phase 4 - ML characterization.
ml = [
    "scikit-learn>=1.5",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    # left unpinned on purpose: hapsira 0.18 (astro group, Phase 2) requires
    # matplotlib<3.8, so a high floor here makes the full env unresolvable.
    "matplotlib",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.uv]
package = false
